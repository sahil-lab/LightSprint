openapi: 3.0.3
info:
  title: LightSprint Phase 1 API
  version: 0.1.0
  description: Local synthetic validation-only skeleton. No domain writes or execution.
servers:
  - url: http://127.0.0.1:18205
paths:
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        "200":
          description: Process is up
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Readiness including PostgreSQL
      responses:
        "200":
          description: Ready
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/system:
    get:
      operationId: getSystemStatus
      summary: Read bootstrap metadata from PostgreSQL
      responses:
        "200":
          description: Database-backed status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [application, phase, status, storage, schemaVersion, mode]
                properties:
                  application:
                    type: string
                    enum: [lightsprint]
                  phase:
                    type: integer
                    enum: [1]
                  status:
                    type: string
                    enum: [ready]
                  storage:
                    type: string
                    enum: [postgresql]
                  schemaVersion:
                    type: integer
                    enum: [1]
                  mode:
                    type: string
                    enum: [validation-only]
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/intake/validate:
    post:
      operationId: validateSpecification
      summary: Validate synthetic input without persisting or executing it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, acceptanceCriteria]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 80
                  pattern: '\S'
                acceptanceCriteria:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    minLength: 1
                    maxLength: 240
                    pattern: '\S'
      responses:
        "200":
          description: Input is valid; nothing is saved or executed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, mode, criterionCount]
                properties:
                  valid:
                    type: boolean
                    enum: [true]
                  mode:
                    type: string
                    enum: [validation-only]
                  criterionCount:
                    type: integer
                    minimum: 1
                    maximum: 10
        "400":
          description: Invalid input or malformed/schema-incompatible JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    StorageUnavailable:
      description: Database read failed; no success-shaped fallback
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
