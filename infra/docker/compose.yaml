name: lightsprint

services:
  # db, api and web come back by themselves when Docker starts and after a crash.
  # Stopping them with `docker compose stop` keeps them stopped across Docker restarts.
  db:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: lightsprint
      POSTGRES_USER: lightsprint
      POSTGRES_PASSWORD: ${LIGHTSPRINT_DB_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
    command: [postgres, -c, max_connections=20, -c, shared_buffers=32MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lightsprint -d lightsprint"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    image: lightsprint-api:local
    build:
      context: ../../services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lightsprint
      SPRING_DATASOURCE_USERNAME: lightsprint
      SPRING_DATASOURCE_PASSWORD: ${LIGHTSPRINT_DB_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18205:8080"
    networks: [edge, private]
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  web:
    image: lightsprint-web:local
    build:
      context: ../../apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:18105:8080"
    networks: [edge]
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  test-db:
    profiles: [tools]
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: lightsprint_test
      POSTGRES_USER: lightsprint
      POSTGRES_PASSWORD: ${LIGHTSPRINT_DB_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
    command: [postgres, -c, max_connections=20, -c, shared_buffers=32MB]
    tmpfs:
      - /var/lib/postgresql/data:size=128m
    networks: [checks]
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lightsprint -d lightsprint_test"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  api-tool:
    profiles: [tools]
    image: maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
    working_dir: /workspace
    volumes:
      - ../../services/api:/workspace
      - maven-cache:/root/.m2
    environment:
      MAVEN_OPTS: -Xmx256m -XX:ActiveProcessorCount=2
      SPRING_DATASOURCE_URL: jdbc:postgresql://test-db:5432/lightsprint_test
      SPRING_DATASOURCE_USERNAME: lightsprint
      SPRING_DATASOURCE_PASSWORD: ${LIGHTSPRINT_DB_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
    depends_on:
      test-db:
        condition: service_healthy
    networks: [tooling, checks]
    cpus: 1.00
    mem_limit: 1024m
    pids_limit: 192
    init: true
    security_opt: [no-new-privileges:true]

  web-tool:
    profiles: [tools]
    image: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    working_dir: /workspace/apps/web
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/apps/web/node_modules
      - npm-cache:/root/.npm
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    networks: [tooling]
    cpus: 1.00
    mem_limit: 768m
    pids_limit: 128
    init: true
    security_opt: [no-new-privileges:true]

  e2e-tool:
    profiles: [tools]
    image: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    working_dir: /workspace
    volumes:
      - ../../tests/e2e:/workspace
      - e2e-node-modules:/workspace/node_modules
      - npm-cache:/root/.npm
    networks: [tooling]
    cpus: 1.00
    mem_limit: 768m
    pids_limit: 128
    init: true
    security_opt: [no-new-privileges:true]

  e2e:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /workspace
    user: "${LIGHTSPRINT_TEST_UID:-1000}:${LIGHTSPRINT_TEST_GID:-1000}"
    environment:
      BASE_URL: http://web:8080
      API_URL: http://api:8080
      RESULTS_DIR: /results
      CI: "true"
      HOME: /tmp
    volumes:
      - ../../tests/e2e:/workspace:ro
      - e2e-node-modules:/workspace/node_modules:ro
      - ../../artifacts/e2e:/results
    networks: [edge]
    cpus: 1.00
    mem_limit: 768m
    pids_limit: 256
    shm_size: 128m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    command: [npm, test]

networks:
  edge: {}
  private:
    internal: true
  checks:
    internal: true
  tooling: {}

volumes:
  postgres-data:
  maven-cache:
  npm-cache:
  web-node-modules:
  e2e-node-modules:
